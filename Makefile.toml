[config]
default_to_workspace = false

[tasks.default]
dependencies = [
    "fix",
    "ci",
]

# ── individual tasks ──────────────────────────────────────────────────────────

[tasks.check-format]
description = "Check formatting (nightly rustfmt)"
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--check"]

[tasks.format]
description = "Apply formatting (nightly rustfmt)"
toolchain = "nightly"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt"]

[tasks.clippy]
description = "Lint (treat warnings as errors)"
command = "cargo"
args = ["clippy", "--no-deps"]

[tasks.test]
description = "Test with default features"
command = "cargo"
args = ["test", "--workspace"]

# ── convenience composites ────────────────────────────────────────────────────

[tasks.fix]
description = "Format + clippy (mirrors fix.sh)"
dependencies = ["format", "clippy"]

[tasks.tests-all]
description = "All test variants (default, ahash, no_std)"
dependencies = ["test"]

[tasks.ci]
description = "Full CI validation (mirrors GitHub Actions)"
dependencies = [
    "check-format",
    "clippy",
    "tests-all",
]
